[package]
name = "API-Server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.2", features = ["full"] }
axum = { version = "0.8.9", features = ["http2", "macros", "ws"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", features = ["clock"] }
dotenvy = "0.15.7"
sqlx = { version = "0.9.0", default-features = false, features = [
	"runtime-tokio",
	"tls-rustls-ring-webpki",
	"postgres",
	"json"
] }